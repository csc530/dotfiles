# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

keymode=default
source = ./binds/default/wm.conf
source = ./binds/default/apps.conf
source-optional = ./binds/default/noctalia.conf



# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,escape,toggleoverview,
bind=SUPER,f,togglefloating,
bind=SHIFT, f11,togglemaximizescreen,
bind=NONE,f11,toggleFullscreen,
bind=SUPER,f11,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,

bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
# bind=ALT,e,set_proportion,1.0
# bind=ALT,x,switch_proportion_preset,




# monitor switch
# bind=alt+shift,Left,focusmon,left
# bind=alt+shift,Right,focusmon,right
# bind=SUPER+Alt,Left,tagmon,left
# bind=SUPER+Alt,Right,tagmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
drag_tile_to_tile=1
mousebind=NONE,btn_middle,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_middle,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client,1
axisbind=SUPER,DOWN,viewtoright_have_client,1



# XF86 special keys
bind = none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind = none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = none,XF86AudioMute,spawn,wpctl set-toggle @DEFAULT_AUDIO_SINK@ toggle
bind = none,XF86AudioNext,spawn,playerctl next
bind = none,MediaPlay,spawn,playerctl play-pause
bind = none,XF86AudioPrev,spawn,playerctl previous
