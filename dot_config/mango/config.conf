# More option see https://github.com/DreamMaoMao/mango/wiki/

# Scroller Layout Setting
scroller_structs=20






scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center = 1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps = 0

# Overview Setting
hotarea_size = 12
enable_hotarea=1
ov_tab_mode = 1
overviewgappi = 6
overviewgappo = 32

# Misc
no_border_when_single = 1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1




# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2.5

cursor_hide_timeout=15


# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# tagrule=id:1,layout_name:tile
# tagrule=id:2,layout_name:tile
# tagrule=id:3,layout_name:tile
# tagrule=id:4,layout_name:tile
# tagrule=id:5,layout_name:tile
# tagrule=id:6,layout_name:tile
# tagrule=id:7,layout_name:tile
# tagrule=id:8,layout_name:tile
# tagrule=id:9,layout_name:tile


bind=SUPER,r,reload_config

#
allow_lock_transparent=1

source = ./autostart.conf
source = ./monitors.conf
source = ./inputs.conf
source = ./effects.conf
source = ./binds/shortcuts.conf
source = ./layers.conf
source = ./appearance/animations.conf
source = ./appearance/effects.conf
source = ./appearance/colours.conf

# This sources the noctalia theme

source = /home/chrisc/.config/mango/noctalia.conf

hotarea_corner = 0
dwindle_smart_split = 1
dwindle_smart_resize = 1
#!! loops viewto[left/right]_have_client dispatchers
tag_carousel = 1
