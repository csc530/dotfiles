# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2


# SHADOWS configuration
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=0


# Window corner radius in pixels
border_radius=12
# Corner radius location (0=all, 1=top-left, 2=top-right, 3=bottom-left, 4=bottom-right, 5=closest-corner)
border_radius_location_default=5

# Disable radius if only one window is visible
no_radius_when_single=0

# Opacity for the active window (0.0 - 1.0)
focused_opacity=1.0

# Opacity for inactive windows
unfocused_opacity=0.85
