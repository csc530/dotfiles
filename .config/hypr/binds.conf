

###################
### KEYBINDINGS ###
###################



# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, centerwindow
bind = $mainMod SHIFT, C, exec, hyprpicker --autocopy --no-fancy --format hex
bind = ALT, F4, killactive
bind = ALT SHIFT, F4, forcekillactive
bindl = $mainMod, M, exec, (pidof wlogout && killall wlogout) || wlogout --show-binds
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, $fileExplorer
bind = $mainMod, F, togglefloating,
# bind = $mainMod, R, exec, fuzzel
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
# bind = $mainMod, L, , # lockscreen
bind = , Print, exec, hyprshot -m window


bind = $mainMod, period, exec, ~/.config/scripts/emojis.nu emojis
bind = $mainMod SHIFT, period, exec, ~/.config/scripts/emojis.nu nerd-fonts

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, $KP_1, workspace, 1
bind = $mainMod, $KP_2, workspace, 2
bind = $mainMod, $KP_3, workspace, 3
bind = $mainMod, $KP_4, workspace, 4
bind = $mainMod, $KP_5, workspace, 5
bind = $mainMod, $KP_6, workspace, 6
bind = $mainMod, $KP_7, workspace, 7
bind = $mainMod, $KP_8, workspace, 8
bind = $mainMod, $KP_9, workspace, 9
bind = $mainMod, $KP_0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, $KP_1, movetoworkspace, 1
bind = $mainMod SHIFT, $KP_2, movetoworkspace, 2
bind = $mainMod SHIFT, $KP_3, movetoworkspace, 3
bind = $mainMod SHIFT, $KP_4, movetoworkspace, 4
bind = $mainMod SHIFT, $KP_5, movetoworkspace, 5
bind = $mainMod SHIFT, $KP_6, movetoworkspace, 6
bind = $mainMod SHIFT, $KP_7, movetoworkspace, 7
bind = $mainMod SHIFT, $KP_8, movetoworkspace, 8
bind = $mainMod SHIFT, $KP_9, movetoworkspace, 9
bind = $mainMod SHIFT, $KP_0, movetoworkspace, 10

binde = $mainMod CTRL, left, workspace, -1
binde = $mainMod CTRL, right, workspace, +1
binde = $mainMod, TAB, workspace, e+1
binde = $mainMod SHIFT, TAB, workspace, e-1

# binde = $mainMod SHIFT, right, movetoworkspace, +1
# binde = $mainMod SHIFT, left, movetoworkspace, -1

binde = $mainMod, 35, cyclenext
binde = $mainMod, 34, cyclenext, prev

# resize windows
binde = $mainMod ALT, left, resizeActive, -10 0
binde = $mainMod ALT, left, moveActive, 5 0

binde = $mainMod ALT, right, resizeActive, 10 0
binde = $mainMod ALT, right, moveActive, -5 0

binde = $mainMod ALT, up, resizeActive, 0 10
binde = $mainMod ALT, up, moveActive, 0 -5

binde = $mainMod ALT, down, resizeActive, 0 -10
binde = $mainMod ALT, down, moveActive, 0 5

# swap windows
binde = $mainMod SHIFT, up, swapwindow, u
binde = $mainMod SHIFT, down, swapwindow, d
binde = $mainMod SHIFT, left, swapwindow, l
binde = $mainMod SHIFT, right, swapwindow, r

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


bindmp = , mouse:274, movewindow
bindmp = $mainMod, mouse:274, resizeWindow
bindmp = ctrl, mouse:274, resizeWindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/scripts/notify.nu -u low "  $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep --perl-regexp --only-matching '\d.\d+' k '{print "Volume: "($1  * 100)"%"}')"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioLowerVolume, exec, ~/.config/scripts/notify.nu -u low "  $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep --perl-regexp --only-matching '\d.\d+' | awk '{print "Volume: "($1  * 100)"%"}')"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindle = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindle = , XF86AudioPrev, exec, playerctl previous

## Globals
bind = Alt, space, exec, $menu
bind = Alt Shift, space, exec, fuzzel # --line-height=64 --lines=5 --width=75
bind = $mainMod, w, exec, $browser

bind = , F11, fullscreen

bind = CTRL SHIFT, space, exec, 1password --ozone-platform-hint=wayland --quick-access



bindt = $mainMod, Pause, exec, killall -SIGUSR1 waybar
bindt = , Pause, exec, killall -SIGUSR2 waybar
