# debug:disable_logs = false

# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = , preffered, auto, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e yazi
$menu = fuzzel --line-height=64 --lines=5 --width=75
$browser = vivaldi


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = systemctl --user start hyprpolkitagent
exec-once = /usr/lib/policykit-1-pantheon/io.elementary.desktop.agent-polkit

# gnome-keyring tings
exec-once = dbus-update-activation-environment --all
# exec-once = gnome-keyring-daemon --start --components=secrets

exec-once = hypridle
exec-once = swww-daemon

exec-once = sleep 1 && waybar --log-level debug

exec-once = sleep 1 && 1password --silent --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once = steam -silent
exec-once = darkman run
exec-once = sleep 1 && discord --start-minimized
exec-once = hyprsunset

# exec-once = udiskie

exec-once = [workspace 1 silent; fullscreen] cool-retro-term
# exec-once = /home/chrisc/.config/hypr/hyprpaper.switcher

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = ELECTRON_OZONE_PLATFORM_HINT,auto


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1]s[false], gapsout:0, gapsin:0
# workspace = f[1]s[false], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[false]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]s[false]
# windowrule = rounding 0, floating:0, onworkspace:f[1]s[false]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_splash_rendering = false
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

$cursorTheme = Catppuccin Macchiato Dark

env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, $cursorTheme
env = HYPRCURSOR_SIZE, 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme $cursorTheme

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

$num7 = 79
$num8 = 80
$num9 = 81
$num4 = 83
$num5 = 84
$num6 = 85
$num1 = 87
$num2 = 88
$num3 = 89
$num0 = 90



# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, centerwindow
bind = $mainMod SHIFT, C, exec, hyprpicker --autocopy --no-fancy --format hex
bind = ALT, F4, killactive
bind = ALT SHIFT, F4, forcekillactive
bindl = $mainMod, M, exec, (pidof wlogout && killall wlogout) || wlogout --show-binds
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, nemo
bind = $mainMod, F, togglefloating,
# bind = $mainMod, R, exec, fuzzel
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
# bind = $mainMod, L, , # lockscreen
bind = , Print, exec, hyprshot -m window


bind = $mainMod, period, exec, ~/.config/scripts/emojis.nu emojis
bind = $mainMod SHIFT, period, exec, ~/.config/scripts/emojis.nu nerd-fonts




# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, $num1, workspace, 1
bind = $mainMod, $num2, workspace, 2
bind = $mainMod, $num3, workspace, 3
bind = $mainMod, $num4, workspace, 4
bind = $mainMod, $num5, workspace, 5
bind = $mainMod, $num6, workspace, 6
bind = $mainMod, $num7, workspace, 7
bind = $mainMod, $num8, workspace, 8
bind = $mainMod, $num9, workspace, 9
bind = $mainMod, $num0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, $num1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, $num2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, $num3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, $num4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, $num5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, $num6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, $num7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, $num8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, $num9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, $num0, movetoworkspace, 10

binde = $mainMod CTRL, left, workspace, -1
binde = $mainMod CTRL, right, workspace, +1
binde = $mainMod ALT CTRL, left, workspace, e-1
binde = $mainMod ALT CTRL, right, workspace, e+1

binde = $mainMod SHIFT, right, movetoworkspace, +1
binde = $mainMod SHIFT, left, movetoworkspace, -1

binde = $mainMod, 35, cyclenext
binde = $mainMod, 34, cyclenext, prev

# resize windows
binde = $mainMod ALT, left, resizeActive, -10 0
binde = $mainMod ALT, left, moveActive, 5 0

binde = $mainMod ALT, right, resizeActive, 10 0
binde = $mainMod ALT, right, moveActive, -5 0

binde = $mainMod ALT, up, resizeActive, 0 10
binde = $mainMod ALT, up, moveActive, 0 -5

binde = $mainMod ALT, down, resizeActive, 0 -10
binde = $mainMod ALT, down, moveActive, 0 5

# swap windows
binde = $mainMod SHIFT, up, swapwindow, u
binde = $mainMod SHIFT, down, swapwindow, d
binde = $mainMod SHIFT, left, swapwindow, l
binde = $mainMod SHIFT, right, swapwindow, r

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1



# Move/resize windows with mainMod + LMB/RMB and dragging
# bindm = $mainMod, mouse:272, movewindow
# bindm = $mainMod, mouse:273, resizewindow
binds {
    # focus_preferred_method = 1
    drag_threshold = 12
}
bindmp = , mouse:274, movewindow
bindmp = $mainMod, mouse:274, resizeWindow
bindmp = ctrl, mouse:274, resizeWindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/scripts/notify.nu -u low "  $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep --perl-regexp --only-matching '\d.\d+' k '{print "Volume: "($1  * 100)"%"}')"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioLowerVolume, exec, ~/.config/scripts/notify.nu -u low "  $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep --perl-regexp --only-matching '\d.\d+' | awk '{print "Volume: "($1  * 100)"%"}')"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindle = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindle = , XF86AudioPrev, exec, playerctl previous

## Globals
bind = Alt, space, exec, $menu
bind = $mainMod, w, exec, $browser

bind = , F11, fullscreen
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# STEAM
windowrule = float, class:^(steam_app_)\d+$
# settings
# windowrule = float,

windowrule = float,class:^vivaldi(-stable)?$,title:Save File
# I don't know below
windowrule = float,class:^()$,title:^()$
# layerrule = pin, title:(?i)(Picture in picture),

# file picker
windowrule = float,class:^(xdg-desktop-portal-gtk)$
windowrule = center,class:^(xdg-desktop-portal-gtk)$

# 1Password
windowrule = float,class:^(1Password)$
windowrule = center,class:^(1Password)$
windowrule = float,class:^(1Password)$,title:(Quick Access)
windowrule = center,class:^(1Password)$,title:(Quick Access)
windowrule = nomaxsize, class:^(1Password)$, focus:1
windowrule = minsize 25% 55%, class:^(1Password)$
windowrule = bordercolor rgb(b4befe), class:^(1Password)$, focus:1

windowrule = bordercolor rgb(a6e3a1),class:^(1Password)$,title:^(Quick Access).*
windowrule = minsize 25% 55%,class:^(1Password)$,title:^(Quick Access).*

# PiP
windowrule = float,title:^(Picture in picture)$
windowrule = content video,title:^(Picture in picture)$
windowrule = pin,title:^(Picture in picture)$
windowrule = opacity 0.7 0.5,title:^(Picture in picture)$
windowrule = dimaround,title:^(Picture in picture)$,focus:1
windowrule = move onscreen cursor 100%-w-20 0-10,title:^(Picture in picture)$

# polybar
windowrule = float,class:^(polybar)
windowrule = bordersize,0,class:^(polybar)

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


####################
###Fun-ctionality###
####################

bind = CTRL SHIFT, space, exec, 1password --ozone-platform-hint=wayland --quick-access

# calculator apps
windowrule = float, class:.*(?i)([c|q]alc).*

windowrule = float, class:^(swayimg)$
windowrule = center, class:^(swayimg)$

bindt = $mainMod, Pause, exec, killall -SIGUSR1 waybar
# bindt = , Pause, exec, killall -SIGUSR2 waybar
