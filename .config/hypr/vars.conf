

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WAYLAND_DISPLAY, # for support of vulkan tings for now???
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = SSH_AUTH_SOCK,~/.1password/agent.sock


$cursorTheme = Catppuccin Macchiato Dark
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, $cursorTheme
env = HYPRCURSOR_SIZE, 24
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme $cursorTheme

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e yazi
$fileExplorer = nautilus --new-window
# suitable alternatives: dlauncher, catapult, fuzzel, synapse, wofi/rofi
$menu = catapult
$browser = vivaldi

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# numpad keys; https://github.com/hyprwm/Hyprland/issues/2682
$KP_0 = KP_Insert
$KP_1 = KP_End
$KP_2 = KP_Down
$KP_3 = KP_Next
$KP_4 = KP_Left
$KP_5 = KP_Begin
$KP_6 = KP_Right
$KP_7 = KP_Home
$KP_8 = KP_Up
$KP_9 = KP_Prior
